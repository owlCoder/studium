name: Pitanje ili predlog (STUDIUM)
description: Pitanje o zahtevu, dizajnu ili integraciji
title: "[STUDIUM] "
body:
  - type: input
    id: requirement
    attributes:
      label: Oznaka zahteva
      description: Na primer ST-011 ili povezani skup zahteva
      placeholder: ST-___
  - type: textarea
    id: context
    attributes:
      label: Kontekst
      description: Koje ponašanje ili poslovno pravilo treba razjasniti?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Pitanje ili predlog
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Uticaj na druge module
      description: Navedite modele, portove i timove na koje promena utiče.
