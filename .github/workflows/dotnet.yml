name: .NET build and tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: studium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Studium.sln
      - name: Build
        run: dotnet build Studium.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Studium.sln --configuration Release --no-build --verbosity normal
