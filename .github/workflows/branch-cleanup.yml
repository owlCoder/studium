name: Remove merged starter branches (one time)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'owlCoder/studium'
    runs-on: ubuntu-latest
    steps:
      - name: Remove only the two merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in feature/studium-starter-template maintenance/studium-repo-polish; do
            if gh api "repos/$GH_REPO/git/ref/heads/$branch" > /dev/null 2>&1; then
              gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
              echo "Deleted branch: $branch"
            else
              echo "Branch already absent: $branch"
            fi
          done
